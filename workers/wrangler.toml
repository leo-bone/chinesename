# Cloudflare Worker configuration for Chinese Name Generator API
name = "chinesename-api"
main = "api/generate.js"
compatibility_date = "2024-01-01"
account_id = "72450e08e207045ce0dc313447dcb5e3"

[vars]
# Environment variables will be set via GitHub Actions secrets
# ⚠️ 密钥不要写进这个文件！它所在的仓库是公开的。
# 正确做法：
#   wrangler secret put DEEPSEEK_API_KEY
# （或用 `wrangler deploy --var DEEPSEEK_API_KEY:...`，值从环境变量读）
# 本地开发用 workers/.env.local（已在 .gitignore 里）
# DEEPSEEK_API_KEY = "<removed>"